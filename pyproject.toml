[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cowmrp"
version = "0.1.0"
description = "Markov reward process (MRP) models of dairy cattle: a domain-free MRP engine with cow and youngstock domains"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
# Author order (first author and primary developer, then supervisor) is the same in CITATION.cff and .zenodo.json. PEP 621 has no affiliation or ORCID field:
# the affiliation (Department of Animal Science, Cornell University, Ithaca, New York, USA) and the ORCIDs (pending) are kept in CITATION.cff and .zenodo.json.
authors = [{ name = "Sumit Sharma" }, { name = "Edward Hansen" }, { name = "Miel Hostens" }]
keywords = ["markov reward process", "dairy cattle", "replacement", "simulation", "livestock"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy", "pandas", "scipy"]

[project.optional-dependencies]
plot = ["matplotlib", "plotly"]
excel = ["openpyxl"]
parquet = ["pyarrow"]
bench = ["psutil"]
notebook = ["jupyter"]
milkbot = ["lactationcurve"]
dev = ["pytest", "ruff", "build", "twine"]
all = ["cowmrp[plot,excel,parquet,bench,notebook]"]

[project.urls]
Homepage = "https://github.com/Bovi-analytics/cow-mrp"
Source = "https://github.com/Bovi-analytics/cow-mrp"
Documentation = "https://bovi-analytics.github.io/cow-mrp/"
Issues = "https://github.com/Bovi-analytics/cow-mrp/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cowmrp.domains.cow" = ["data/*", "rewards/*.json"]
"cowmrp.data" = ["*.csv", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider -m 'not slow and not install'"   # fast by default; pytest -m slow | -m install | -m "slow or install or not slow" for the rest
markers = [
    "slow: long-running",
    "install: builds the wheel and installs it in a fresh venv (needs network for dependencies)",
    "performance: timing and memory budgets",
]
