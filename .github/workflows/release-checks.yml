# Expensive checks, run by hand before a release (Actions tab -> "Release checks" -> Run workflow). Never runs on push or pull request.
#   slow:    day-resolution parity and weekly Monte Carlo (about 15-45 minutes)
#   install: builds the wheel, installs it in a brand-new virtual environment and uses it from another directory (needs network, about 3 minutes)
# Read-only permissions: this workflow builds and tests only. It does not upload to PyPI, create a release or deploy anything.
name: Release checks

on:
  workflow_dispatch:
    inputs:
      python:
        description: "Python version"
        default: "3.12"
        type: string

permissions:
  contents: read

jobs:
  slow:
    name: slow set (day resolution, weekly Monte Carlo)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev,plot,parquet]"
      - run: python -m pytest -q -m "slow and not install" --durations=10

  install:
    name: clean install from a built wheel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev,plot,parquet]"
      - run: python -m pytest -q -m install
      - name: Build sdist and wheel and check the metadata (nothing is uploaded)
        run: |
          python -m build --outdir dist .
          python -m twine check dist/*
