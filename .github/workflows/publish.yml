# Publishes cowmrp to PyPI (or TestPyPI) with PyPI Trusted Publishing: no API token is stored anywhere.
# MANUAL ONLY: Actions tab -> "Publish to PyPI" -> Run workflow. It never runs on push, pull request or release,
# so creating a GitHub release can not upload anything by accident. A PyPI upload can not be undone or replaced.
#
# One-time setup (nothing below is configured by this file):
#   PyPI      project cowmrp -> Manage -> Publishing -> add a GitHub trusted publisher:
#               owner Bovi-analytics, repository cow-mrp, workflow publish.yml, environment pypi
#   TestPyPI  the same on test.pypi.org (a separate account), environment testpypi
#   GitHub    Settings -> Environments: create "pypi" and "testpypi"; on "pypi" add yourself as a required reviewer if
#             the plan allows it (the manual approval step before an upload).
#
# Use: run it first with target = testpypi, check the install, then run it again with target = pypi.
# The real upload must run from a version tag (for example v0.1.1): choose the tag in "Use workflow from".
# The version typed in the form must equal the version in pyproject.toml, so a wrong version can not be uploaded.
name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Where to upload"
        type: choice
        options: [testpypi, pypi]
        default: testpypi
      version:
        description: "Version to publish (must equal the version in pyproject.toml, e.g. 0.1.1)"
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: build and check the distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: The requested version must be the version in pyproject.toml
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          python - <<'EOF'
          import os, tomllib
          have = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          want = os.environ["REQUESTED"].strip()
          assert have == want, f"pyproject.toml says {have}, the form says {want}"
          print("version", have)
          EOF
      - run: python -m pip install -e ".[dev,plot,parquet]"
      - run: python -m pytest -q
      - name: Build the sdist and the wheel
        run: |
          python -m build --outdir dist .
          python -m twine check --strict dist/*
      - name: Both distributions must carry the Apache-2.0 licence text
        run: |
          python - <<'EOF'
          import glob, tarfile, zipfile
          whl = zipfile.ZipFile(glob.glob("dist/*.whl")[0])
          lic = [n for n in whl.namelist() if n.endswith("licenses/LICENSE")]
          assert lic, "wheel has no LICENSE"
          assert b"Apache License" in whl.read(lic[0]) and b"Version 2.0, January 2004" in whl.read(lic[0])
          meta = [n for n in whl.namelist() if n.endswith("METADATA")][0]
          assert b"License-Expression: Apache-2.0" in whl.read(meta), "wheel metadata is not Apache-2.0"
          tar = tarfile.open(glob.glob("dist/*.tar.gz")[0])
          member = [n for n in tar.getnames() if n.endswith("/LICENSE")][0]
          assert b"Apache License" in tar.extractfile(member).read(), "sdist LICENSE is not Apache"
          print("licence text present in the wheel and the sdist")
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish-testpypi:
    name: upload to TestPyPI
    if: ${{ inputs.target == 'testpypi' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/cowmrp/
    permissions:
      id-token: write   # the only job with this permission: it is what Trusted Publishing uses instead of a token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: false   # signed attestations are designed for public repositories; the repository is private for now

  publish-pypi:
    name: upload to PyPI
    # Only from a version tag, so the file on PyPI always matches a tagged commit.
    if: ${{ inputs.target == 'pypi' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cowmrp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: false
